<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaudeRU — ваш домашний Claude</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<section id="login"><div class="mark">✳</div><h1>Ваш Claude.<br>Где бы вы ни были.</h1><p>Подключитесь к домашнему Mac, чтобы продолжить разговор.</p><form id="login-form"><label for="password">Пароль вашего сайта</label><input id="password" type="password" autocomplete="current-password" required><button>Войти →</button></form><p id="login-error" role="alert"></p></section>
<div id="app" hidden><aside><a class="brand" href="/">✳ ClaudeRU</a><button id="new-chat">＋ Новый разговор</button><nav id="chats" aria-label="Разговоры"></nav><footer>Через ваш домашний Mac<button id="logout">Выйти</button></footer></aside><main><header><span>Личное пространство</span><span class="badge">Домашний Mac</span></header><div id="messages" aria-live="polite"></div><div class="composer"><p id="status" role="status"></p><form id="chat-form"><textarea id="prompt" placeholder="О чём поговорим?" aria-label="Сообщение" rows="3" maxlength="20000" required></textarea><div><span>Claude через claude.ai</span><button id="send">Отправить ↑</button></div></form><small>История этой обёртки хранится в этом браузере. Claude также сохраняет чаты в вашем аккаунте.</small></div></main></div>
</body></html>
