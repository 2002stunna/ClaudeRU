<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaudeRU — ваш домашний Claude</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<section id="login"><div class="mark">✳</div><h1>Ваш Claude.<br>Где бы вы ни были.</h1><p>Ваши разговоры и файлы — через домашний Mac.</p><form id="login-form"><label for="password">Пароль вашего сайта</label><input id="password" type="password" autocomplete="current-password" required><button>Войти →</button></form><p id="login-error" role="alert"></p></section>
<div id="app" hidden>
<aside id="sidebar"><a class="brand" href="/">✳ ClaudeRU</a><button id="new-chat">＋ Новый разговор</button><label class="search-label" for="search">Поиск по чатам</label><input id="search" type="search" placeholder="Найти разговор…"><div class="sidebar-label"><span>Разговоры</span><button id="sync" title="Загрузить видимые чаты и модели из Claude" aria-label="Синхронизировать с Claude">↻</button></div><nav id="chats" aria-label="Разговоры"></nav><p class="sidebar-note">Чаты и файлы хранятся на вашем Mac</p><footer><span>Личное пространство</span><button id="logout">Выйти</button></footer></aside>
<main><header><div><button id="toggle-sidebar" aria-label="Показать или скрыть список чатов" aria-expanded="false">☰</button><span id="chat-title">Новый разговор</span><button id="refresh-chat" title="Обновить содержимое чата из Claude" aria-label="Обновить текущий чат">↻</button></div><span class="badge">Проверяем Mac…</span></header><div id="messages" aria-live="polite"></div><div class="composer"><p id="status" role="status"></p><div id="attachments" aria-label="Прикреплённые файлы"></div><form id="chat-form"><textarea id="prompt" placeholder="О чём поговорим?" aria-label="Сообщение" rows="3" maxlength="20000"></textarea><div class="composer-toolbar"><div class="compose-settings"><button type="button" id="attach" aria-label="Добавить файлы" title="До 5 файлов, каждый до 20 МБ, всего до 25 МБ">＋</button><input id="file-input" type="file" multiple hidden><label class="setting">Модель<select id="model" aria-label="Модель"><option value="">Как в Claude</option></select></label><label class="setting">Усилия<select id="effort" aria-label="Уровень усилий"><option value="">Как в Claude</option></select></label><button type="button" id="refresh-models" aria-label="Обновить модели из Claude" title="Обновить модели из Claude">↻</button></div><button id="send" type="submit">Отправить ↑</button></div></form><small id="catalog-note">Нажмите ↻, чтобы загрузить модели и чаты из открытого Claude.</small></div></main>
</div>
<dialog id="file-preview"><div class="preview-heading"><strong id="preview-name"></strong><button id="close-preview" aria-label="Закрыть просмотр">✕</button></div><pre id="preview-text"></pre><a id="preview-download" class="download" download>Скачать файл ↓</a></dialog>
</body></html>
